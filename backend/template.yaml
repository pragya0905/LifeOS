AWSTemplateFormatVersion: "2010-09-09"
Transform: AWS::Serverless-2016-10-31
Description: LifeOs backend — Cognito auth, DynamoDB tables, HTTP API, health-check Lambda (Phase 1 / Step 1)

Parameters:
  Environment:
    Type: String
    Default: dev
    AllowedValues: [dev, prod]
  AllowedOrigins:
    Type: CommaDelimitedList
    Default: "http://localhost:5173,http://localhost:5174"
    Description: CORS origins allowed to call the HTTP API (add the deployed frontend URL later). 5174 covers Vite's auto-fallback port when 5173 is already in use by another local project.

Globals:
  Function:
    Runtime: nodejs20.x
    Architectures: [arm64]
    Timeout: 10
    MemorySize: 128
    Tracing: Active
    Environment:
      Variables:
        ENVIRONMENT: !Ref Environment
        LOG_LEVEL: INFO

Resources:

  ########################
  # Cognito
  ########################
  LifeOsUserPool:
    Type: AWS::Cognito::UserPool
    Properties:
      UserPoolName: !Sub "lifeos-${Environment}"
      UsernameAttributes: [email]
      AutoVerifiedAttributes: [email]
      Schema:
        - Name: email
          Required: true
          Mutable: true
      Policies:
        PasswordPolicy:
          MinimumLength: 8
          RequireLowercase: true
          RequireUppercase: true
          RequireNumbers: true
          RequireSymbols: false
      AccountRecoverySetting:
        RecoveryMechanisms:
          - Name: verified_email
            Priority: 1
      VerificationMessageTemplate:
        DefaultEmailOption: CONFIRM_WITH_CODE
      EmailVerificationSubject: "Your LifeOs verification code"
      EmailVerificationMessage: "Your LifeOs verification code is {####}"

  LifeOsUserPoolClient:
    Type: AWS::Cognito::UserPoolClient
    Properties:
      UserPoolId: !Ref LifeOsUserPool
      ClientName: !Sub "lifeos-web-${Environment}"
      GenerateSecret: false
      PreventUserExistenceErrors: ENABLED
      ExplicitAuthFlows:
        - ALLOW_USER_SRP_AUTH
        - ALLOW_REFRESH_TOKEN_AUTH
        - ALLOW_ADMIN_USER_PASSWORD_AUTH
      AccessTokenValidity: 60
      IdTokenValidity: 60
      RefreshTokenValidity: 30
      TokenValidityUnits:
        AccessToken: minutes
        IdToken: minutes
        RefreshToken: days

  ########################
  # DynamoDB
  ########################
  TasksTable:
    Type: AWS::DynamoDB::Table
    Properties:
      TableName: !Sub "LifeOs-Tasks-${Environment}"
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - AttributeName: userId
          AttributeType: S
        - AttributeName: taskId
          AttributeType: S
      KeySchema:
        - AttributeName: userId
          KeyType: HASH
        - AttributeName: taskId
          KeyType: RANGE
      SSESpecification:
        SSEEnabled: true
      PointInTimeRecoverySpecification:
        PointInTimeRecoveryEnabled: true

  JournalEntriesTable:
    Type: AWS::DynamoDB::Table
    Properties:
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - AttributeName: userId
          AttributeType: S
        - AttributeName: date
          AttributeType: S
      KeySchema:
        - AttributeName: userId
          KeyType: HASH
        - AttributeName: date
          KeyType: RANGE
      SSESpecification:
        SSEEnabled: true
      PointInTimeRecoverySpecification:
        PointInTimeRecoveryEnabled: true

  HabitLogsTable:
    Type: AWS::DynamoDB::Table
    Properties:
      TableName: !Sub "LifeOs-HabitLogs-${Environment}"
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - AttributeName: userId
          AttributeType: S
        - AttributeName: dateHabitType
          AttributeType: S
      KeySchema:
        - AttributeName: userId
          KeyType: HASH
        - AttributeName: dateHabitType
          KeyType: RANGE
      SSESpecification:
        SSEEnabled: true
      PointInTimeRecoverySpecification:
        PointInTimeRecoveryEnabled: true

  MedicationsTable:
    Type: AWS::DynamoDB::Table
    Properties:
      TableName: !Sub "LifeOs-Medications-${Environment}"
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - AttributeName: userId
          AttributeType: S
        - AttributeName: medicationId
          AttributeType: S
      KeySchema:
        - AttributeName: userId
          KeyType: HASH
        - AttributeName: medicationId
          KeyType: RANGE
      SSESpecification:
        SSEEnabled: true
      PointInTimeRecoverySpecification:
        PointInTimeRecoveryEnabled: true

  MedicationLogsTable:
    Type: AWS::DynamoDB::Table
    Properties:
      TableName: !Sub "LifeOs-MedicationLogs-${Environment}"
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - AttributeName: userId
          AttributeType: S
        - AttributeName: dateMedicationId
          AttributeType: S
      KeySchema:
        - AttributeName: userId
          KeyType: HASH
        - AttributeName: dateMedicationId
          KeyType: RANGE
      SSESpecification:
        SSEEnabled: true
      PointInTimeRecoverySpecification:
        PointInTimeRecoveryEnabled: true

  LogEntriesTable:
    Type: AWS::DynamoDB::Table
    Properties:
      TableName: !Sub "LifeOs-LogEntries-${Environment}"
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - AttributeName: userId
          AttributeType: S
        - AttributeName: logId
          AttributeType: S
      KeySchema:
        - AttributeName: userId
          KeyType: HASH
        - AttributeName: logId
          KeyType: RANGE
      SSESpecification:
        SSEEnabled: true
      PointInTimeRecoverySpecification:
        PointInTimeRecoveryEnabled: true

  RoutineTemplatesTable:
    Type: AWS::DynamoDB::Table
    Properties:
      TableName: !Sub "LifeOs-RoutineTemplates-${Environment}"
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - AttributeName: userId
          AttributeType: S
        - AttributeName: routineId
          AttributeType: S
      KeySchema:
        - AttributeName: userId
          KeyType: HASH
        - AttributeName: routineId
          KeyType: RANGE
      SSESpecification:
        SSEEnabled: true
      PointInTimeRecoverySpecification:
        PointInTimeRecoveryEnabled: true

  RoutineLogsTable:
    Type: AWS::DynamoDB::Table
    Properties:
      TableName: !Sub "LifeOs-RoutineLogs-${Environment}"
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - AttributeName: userId
          AttributeType: S
        - AttributeName: dateRoutineStep
          AttributeType: S
      KeySchema:
        - AttributeName: userId
          KeyType: HASH
        - AttributeName: dateRoutineStep
          KeyType: RANGE
      SSESpecification:
        SSEEnabled: true
      PointInTimeRecoverySpecification:
        PointInTimeRecoveryEnabled: true

  ########################
  # API Gateway (HTTP API) + Cognito JWT authorizer
  ########################
  HttpApi:
    Type: AWS::Serverless::HttpApi
    Properties:
      StageName: !Ref Environment
      CorsConfiguration:
        AllowOrigins: !Ref AllowedOrigins
        AllowHeaders: ["Content-Type", "Authorization"]
        AllowMethods: ["GET", "POST", "PATCH", "DELETE", "OPTIONS"]
      Auth:
        Authorizers:
          CognitoAuthorizer:
            IdentitySource: "$request.header.Authorization"
            JwtConfiguration:
              issuer: !Sub "https://cognito-idp.${AWS::Region}.amazonaws.com/${LifeOsUserPool}"
              audience:
                - !Ref LifeOsUserPoolClient
        DefaultAuthorizer: CognitoAuthorizer

  ########################
  # Lambda — health check / whoami (proves Cognito + API GW wiring)
  ########################
  WhoAmIFunction:
    Type: AWS::Serverless::Function
    Metadata:
      BuildMethod: esbuild
      BuildProperties:
        Minify: true
        Target: "node20"
        Sourcemap: false
        EntryPoints: ["index.ts"]
    Properties:
      FunctionName: !Sub "lifeos-whoami-${Environment}"
      CodeUri: src/functions/whoami/
      Handler: index.handler
      Events:
        WhoAmI:
          Type: HttpApi
          Properties:
            ApiId: !Ref HttpApi
            Path: /whoami
            Method: GET
            Auth:
              Authorizer: CognitoAuthorizer

  ########################
  # Lambda — Tasks CRUD
  ########################
  CreateTaskFunction:
    Type: AWS::Serverless::Function
    Metadata:
      BuildMethod: esbuild
      BuildProperties:
        Minify: true
        Target: "node20"
        Sourcemap: false
        EntryPoints: ["index.ts"]
    Properties:
      FunctionName: !Sub "lifeos-create-task-${Environment}"
      CodeUri: src/functions/createTask/
      Handler: index.handler
      Timeout: 30
      Environment:
        Variables:
          TASKS_TABLE_NAME: !Ref TasksTable
          ANTHROPIC_API_KEY_PARAM: !Sub "/lifeos/${Environment}/anthropic-api-key"
      Policies:
        - DynamoDBCrudPolicy:
            TableName: !Ref TasksTable
        - SSMParameterReadPolicy:
            ParameterName: !Sub "lifeos/${Environment}/anthropic-api-key"
      Events:
        CreateTask:
          Type: HttpApi
          Properties:
            ApiId: !Ref HttpApi
            Path: /tasks
            Method: POST
            Auth:
              Authorizer: CognitoAuthorizer

  ListTasksFunction:
    Type: AWS::Serverless::Function
