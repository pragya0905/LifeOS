            Path: /routine-logs/{date}/{routineId}/{stepIndex}
            Method: PATCH
            Auth:
              Authorizer: CognitoAuthorizer

  GetRoutineLogsForDateFunction:
    Type: AWS::Serverless::Function
    Metadata:
      BuildMethod: esbuild
      BuildProperties:
