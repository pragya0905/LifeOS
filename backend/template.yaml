      CodeUri: src/functions/listTasks/
      Handler: index.handler
      Environment:
        Variables:
          TASKS_TABLE_NAME: !Ref TasksTable
      Policies:
        - DynamoDBReadPolicy:
            TableName: !Ref TasksTable
      Events:
        ListTasks:
          Type: HttpApi
          Properties:
            ApiId: !Ref HttpApi
            Path: /tasks
            Method: GET
            Auth:
              Authorizer: CognitoAuthorizer

  UpdateTaskFunction:
    Type: AWS::Serverless::Function
    Metadata:
      BuildMethod: esbuild
      BuildProperties:
        Minify: true
        Target: "node20"
        Sourcemap: false
        EntryPoints: ["index.ts"]
    Properties:
      FunctionName: !Sub "lifeos-update-task-${Environment}"
      CodeUri: src/functions/updateTask/
      Handler: index.handler
      Timeout: 30
      Environment:
        Variables:
          TASKS_TABLE_NAME: !Ref TasksTable
          ANTHROPIC_API_KEY_PARAM: !Sub "/lifeos/${Environment}/anthropic-api-key"
      Policies:
        - DynamoDBCrudPolicy:
            TableName: !Ref TasksTable
        - SSMParameterReadPolicy:
