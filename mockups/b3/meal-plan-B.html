<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=412">
<title>Meal Plan B</title>
<style>
:root{--paper:#191320;--card:#221a2b;--ink:#f3eef0;--muted:#b3a6ba;--stone:#332a3b;--bloom:#ff6f5e;--amber:#e8a33d}
*{box-sizing:border-box}body{margin:0;background:#0f0b14;font-family:Inter,system-ui,sans-serif;color:var(--ink)}
.frame{width:412px;min-height:860px;margin:0 auto;background:var(--paper);padding:16px;overflow:hidden}
h1{font-family:"Bricolage Grotesque",system-ui;font-size:26px;margin:4px 0 12px}
.label{font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);margin:14px 0 6px}
.card{background:var(--card);border:1px solid var(--stone);border-radius:14px;padding:12px}
.rule{border-left:3px solid var(--bloom);padding-left:12px}
.btn{min-height:40px;min-width:40px;border-radius:999px;border:1px solid var(--stone);background:var(--card);color:var(--ink);font:inherit;padding:0 14px}
.btn.on{background:var(--bloom);border-color:var(--bloom);color:#191320}
.row{display:flex;gap:8px;align-items:center}
.grow{flex:1}
.input{width:100%;min-height:40px;border-radius:10px;border:1px solid var(--stone);background:#191320;color:var(--ink);padding:8px 10px;font:inherit;font-size:15px}
.meal{display:grid;grid-template-columns:86px 1fr;gap:10px;align-items:start;padding:8px 0;border-top:1px solid var(--stone)}
.meal:first-child{border-top:0}
.mlabel{font-size:13px;color:var(--muted);padding-top:10px}
.num{font-variant-numeric:tabular-nums}
.today{color:var(--bloom)}
.note{font-size:12px;color:var(--muted);margin-top:14px;line-height:1.4}
.tag{font-size:11px;color:var(--amber);border:1px solid var(--amber);border-radius:999px;padding:2px 8px}
</style></head><body><div class="frame">

<h1>Meal Plan</h1>
<div class="row"><button class="btn">‹ Week</button><div class="grow" style="text-align:center;font-weight:600">23 – 29 Oct</div><button class="btn">Week ›</button></div>
<div class="label">Thu 23 Oct <span class="today">•</span></div><div class="card rule"><div class="meal"><div class="mlabel">Breakfast</div><input class="input" value="Oats with banana" placeholder="Add"></div><div class="meal"><div class="mlabel">Lunch</div><input class="input" value="Dal, rice, cucumber salad" placeholder="Add"></div><div class="meal"><div class="mlabel">Dinner</div><input class="input" value="" placeholder="Add"></div><div class="meal"><div class="mlabel">Snack</div><input class="input" value="" placeholder="Add"></div></div><div class="label">Fri 24 Oct</div><div class="card rule"><div class="meal"><div class="mlabel">Breakfast</div><input class="input" value="Poha" placeholder="Add"></div><div class="meal"><div class="mlabel">Lunch</div><input class="input" value="" placeholder="Add"></div><div class="meal"><div class="mlabel">Dinner</div><input class="input" value="Khichdi" placeholder="Add"></div><div class="meal"><div class="mlabel">Snack</div><input class="input" value="" placeholder="Add"></div></div><div class="label">Sat 25 Oct</div><div class="card rule"><div class="meal"><div class="mlabel">Breakfast</div><input class="input" value="" placeholder="Add"></div><div class="meal"><div class="mlabel">Lunch</div><input class="input" value="" placeholder="Add"></div><div class="meal"><div class="mlabel">Dinner</div><input class="input" value="" placeholder="Add"></div><div class="meal"><div class="mlabel">Snack</div><input class="input" value="" placeholder="Add"></div></div>
<div class="label">Weekly defaults</div>
<div class="card"><div class="row"><div class="grow">Set a default for every Monday</div><button class="btn">Edit</button></div></div>
<p class="note">Static mockup, 412px, dark theme. No real data. Option B: pick A or B.</p>
</div></body></html>
